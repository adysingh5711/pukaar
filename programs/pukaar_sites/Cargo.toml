# rules (pure) and guest (risc0 program, built with build.sh, never `cargo build`).
# The runner is its own workspace: its wallet dependencies need newer crates than the guest pins allow.
[workspace]
resolver = "3"
members = ["rules", "guest"]
exclude = ["runner"]

# Pins from logos-lez-rln. The guest toolchain is rustc 1.88, so hold these back in Cargo.lock:
#   ruint = 1.17.0 (1.18+ needs 1.90), enum-ordinalize and enum-ordinalize-derive = 4.3.2 (4.4 needs 1.89),
#   sha2 = 0.10.8 so the risc0 SHA-256 patch applies.
# Re-pin after any `cargo update`.
[patch.crates-io]
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }
# risc0 bigint accelerator for ed25519 verify (probe step d)
crypto-bigint = { git = "https://github.com/risc0/RustCrypto-crypto-bigint", tag = "v0.5.5-risczero.0" }
curve25519-dalek = { git = "https://github.com/risc0/curve25519-dalek", tag = "curve25519-4.1.3-risczero.0" }

[profile.release]
lto = "fat"
codegen-units = 1
