[package]
name = "pukaar_core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# Standalone crate: the empty table keeps cargo from adopting a parent workspace.
# `logic` is excluded because it declares its own `[workspace]` (so it stays
# plain-`cargo test`-able on its own, no Nix needed) — nesting a workspace
# root inside another workspace's member set is a cargo error otherwise.
[workspace]
exclude = ["logic"]

[lib]
crate-type = ["staticlib"]

[dependencies]
hex = "0.4"
pukaar_logic = { path = "logic" }
serde_json = "1"
# Staged by the builder from the same revision as its code generator (Step 7).
logos-rust-sdk = { path = "../logos-rust-sdk-src" }
